[package]
name = "cuda-browser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "compiler/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned from rsntlabs/wgpu dev/cuda, 2026-10-26.
naga = { git = "https://github.com/rsntlabs/wgpu", rev = "02f26c369996e6204d38069048be9051c2ea4e74", features = ["cuda-in", "wgsl-out", "wgsl-in"] }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
